context:
  version: "4.0.0"

package:
  name: bw2calc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/bw2calc/bw2calc-${{ version }}.tar.gz
  sha256: 5dbfaaeaa6214d344fe1159a7d2ace406b1dfb68177965b636c593f9c206edf3

build:
  script: python -m pip install . -vv
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - if: osx
      then:
        - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=68.0
  run:
    - bw_processing >=1.6
    - fsspec >=2023.3.0
    - matrix_utils >=0.9
    - numpy >=1.23.2,<3
    - pandas >=1.5.0
    - pydantic >=2
    - python
    - scipy >=1.11
    - stats_arrays >=0.5.1
    - threadpoolctl >=3.0.0
    - xarray >=2023.9.0
    - if: osx and arm64
      then:
        - scikit-umfpack
      else:
        - pypardiso

tests:
  - python:
      imports:
        - bw2calc
      pip_check: false

about:
  homepage: https://github.com/brightway-lca/brightway2-calc
  summary: 'The calculation engine for the Brightway2 life cycle assessment framework.'
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/brightway-lca/brightway2-calc

extra:
  recipe-maintainers:
    - cmutel
    - m-rossi
