{% set name = "bw2calc" %}
{% set version = "2.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 533df462fcc45369535d60b7b85a00f8db04cbe6486ba2f4104bf052af9878cd

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools >=68.0
  run:
    - bw_processing >=1.0
    - fsspec
    - matrix_utils >=0.6
    - numpy <3
    - pandas
    - pydantic
    - pypardiso  # [not (osx and arm64)]
    - python
    - scikit-umfpack  # [osx and arm64]
    - scipy
    - stats_arrays
    - xarray

test:
  imports:
    - bw2calc

about:
  home: https://github.com/brightway-lca/brightway2-calc
  summary: 'The calculation engine for the Brightway2 life cycle assessment framework.'
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/brightway-lca/brightway2-calc

extra:
  recipe-maintainers:
    - cmutel
    - m-rossi
